name: LedgerOne CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - run: cp .env.example .env
      - run: touch database/database.sqlite && sed -i "s#DB_DATABASE=.*#DB_DATABASE=${{ github.workspace }}/database/database.sqlite#" .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan test
      - run: php artisan ledgerone:integrity-check
      - run: find app database routes bootstrap config tests -name '*.php' -print0 | xargs -0 -n1 php -l

  mysql:
    name: MySQL 8 / PHP 8.3
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ledgerone
          MYSQL_USER: ledgerone
          MYSQL_PASSWORD: ledgerone
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env
      - run: php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ledgerone
          DB_USERNAME: ledgerone
          DB_PASSWORD: ledgerone
      - run: php artisan migrate:fresh --seed --force
        env: &mysqlenv
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ledgerone
          DB_USERNAME: ledgerone
          DB_PASSWORD: ledgerone
      - run: php artisan test
        env: *mysqlenv
      - run: php artisan ledgerone:integrity-check
        env: *mysqlenv
